# ============================================================
#  NovaLife RP — permissions.cfg
#  Déclare les groupes ACE et les principals.
#  L'ordre est IMPORTANT: ce fichier est exec avant les ressources
#  qui s'appuient sur ces ACE (novalife_admin, novalife_core).
#
#  Règle critique (leçon FiveM): 'add_ace console principal allow'
#  DOIT être présent AVANT tout 'add_principal', sinon les
#  add_principal sont refusés.
# ============================================================

# --- Console = principal (sinon add_principal échoue) ---
add_ace resource.novalife_core command.accept allow
add_ace resource.novalife_admin command.accept allow
add_ace console principal allow

# --- Groupes NovaLife (hiérarchie) ---
add_principal group.helper        group.user
add_principal group.mod           group.helper
add_principal group.admin         group.mod
add_principal group.superadmin    group.admin
add_principal group.owner        group.superadmin

-- Le grade owner ne peut JAMAIS être modifié par un admin inférieur.
-- Seul le serveur (Config.OwnerIdentifiers) détermine le propriétaire.
-- Aucun add_principal vers group.owner ne doit être ajouté hors de ce fichier.
add_ace resource.novalife_owner command.accept allow

# --- ACE par commande (vérifiés via IsPlayerAceAllowed) ---
add_ace group.mod          command.kick     allow
add_ace group.mod          command.freeze   allow
add_ace group.mod          command.goto     allow
add_ace group.mod          command.bring    allow
add_ace group.mod          command.revive   allow
add_ace group.mod          command.heal     allow
add_ace group.mod          command.dv       allow

add_ace group.admin        command.ban      allow
add_ace group.admin        command.unban    allow
add_ace group.admin        command.tpm      allow
add_ace group.admin        command.car      allow

add_ace group.superadmin   command.givemoney allow
add_ace group.superadmin   command.setjob    allow
add_ace group.superadmin   command.setgrade  allow

add_ace group.owner        command.*        allow

# --- Ressources autorisées à déclarer des événements/commandes ---
add_ace resource.novalife_core   command.accept allow
add_ace resource.novalife_admin  command.accept allow
add_ace resource.novalife_police command.accept allow
add_ace resource.novalife_ems    command.accept allow
add_ace resource.novalife_chat   command.accept allow
add_ace resource.novalife_banking command.accept allow
add_ace resource.novalife_identity command.accept allow
add_ace resource.novalife_spawn  command.accept allow
add_ace resource.novalife_garages command.accept allow
add_ace resource.novalife_keys    command.accept allow
add_ace resource.novalife_fuel    command.accept allow
add_ace resource.novalife_cardealer command.accept allow
add_ace resource.novalife_mechanic command.accept allow
add_ace resource.novalife_billing command.accept allow
add_ace resource.novalife_business command.accept allow
add_ace resource.novalife_phone   command.accept allow
add_ace resource.novalife_utils   command.accept allow
